<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>500 — সার্ভার সমস্যা | SoftVerse IT</title>
  <link rel="icon" type="image/png" href="./Images/favicon.webp">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <style>
    :root{--teal:#00b894;--navy:#0f1c3a;--bg:#020509;--text:#e8f0fe;--muted:#8fafc8;--border:rgba(0,184,148,.15)}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;font-family:'Hind Siliguri',sans-serif;background:var(--bg);color:var(--text)}
    body{display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem}
    .card{background:rgba(26,46,94,.4);border:1px solid var(--border);backdrop-filter:blur(12px);
      border-radius:18px;padding:3rem 2.2rem;max-width:540px;width:90%;box-shadow:0 0 60px rgba(0,184,148,.08)}
    .code{font-family:'Syne',sans-serif;font-size:5rem;font-weight:800;color:var(--teal);line-height:1}
    h1{font-size:1.6rem;margin:1.2rem 0 .3rem}
    p{font-size:1rem;color:var(--muted);margin:1rem 0 2rem;line-height:1.5}
    a.btn{background:var(--teal);color:#020509;padding:.7rem 1.3rem;border-radius:10px;text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:.5rem}
    .blob{position:fixed;border-radius:50%;filter:blur(140px);pointer-events:none;z-index:0;opacity:.6}
    .b1{width:520px;height:520px;top:-240px;right:-180px;background:rgba(0,184,148,.12)}
  </style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="card">
    <div class="code">500</div>
    <h1>ওহ! কিছু একটা সমস্যা হয়েছে</h1>
    <p>সার্ভারে আনপ্রত্যাশিত একটি সমস্যা ঘটেছে। আমরা এটা ঠিক করার চেষ্টা করছি। একটু পরে আবার চেষ্টা করুন।</p>
    <a class="btn" href="/"><i class="fa-solid fa-house"></i> হোম পেজে ফিরে যান</a>
  </div>
</body>
</html>
