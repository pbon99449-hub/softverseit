<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 — পাতা পাওয়া যায়নি | SoftVerse IT</title>
  <link rel="icon" type="image/png" href="./Images/favicon.webp">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <style>
    :root{
      --teal:#00b894; --navy:#0f1c3a; --navy-l:#1a2e5e; --bg:#020509; --text:#e8f0fe; --muted:#8fafc8;
      --border:rgba(0,184,148,.15);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    [hidden]{display:none !important}
    html,body{height:100%;font-family:'Hind Siliguri',sans-serif;background:var(--bg);color:var(--text)}
    body{display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem}
    .card{background:rgba(10,26,56,.45);border:1px solid var(--border);backdrop-filter:blur(12px);
      border-radius:18px;padding:3rem 2.2rem;max-width:560px;width:90%;box-shadow:0 0 60px rgba(0,184,148,.08)}
    .code{font-family:'Syne',sans-serif;font-size:6rem;font-weight:800;background:linear-gradient(90deg,var(--teal),#5fffdb);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
    h1{font-size:1.6rem;margin:1rem 0 .3rem}
    p{font-size:1rem;color:var(--muted);margin:1rem 0 2rem;line-height:1.5}
    .actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
    a.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.7rem 1.3rem;border-radius:10px;text-decoration:none;font-weight:600}
    a.home{background:var(--teal);color:#020509}
    a.admin{background:rgba(255,255,255,.08);border:1px solid var(--border);color:#e8f0fe}
    .blob{position:fixed;border-radius:50%;filter:blur(140px);pointer-events:none;z-index:0;opacity:.6}
    .b1{width:520px;height:520px;top:-240px;right:-180px;background:rgba(0,184,148,.12)}
    .b2{width:420px;height:420px;bottom:-200px;left:-180px;background:rgba(26,46,94,.55)}
  </style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="card">
    <div class="code">404</div>
    <h1>ওহ! এই পাতাটি পাওয়া যায়নি</h1>
    <p>আপনার যে ঠিকানাটি খুলতে চাইছেন, সেটি আমরা পাচ্ছি না। হয়তো ঠিকানাটি ভুল, অথবা পাতাটি সরানো হয়েছে।</p>
    <div class="actions">
      <a class="btn home" href="/"><i class="fa-solid fa-house"></i> হোম পেজে যান</a>
      <a class="btn admin" href="/admin/login.html" hidden><i class="fa-solid fa-right-to-bracket"></i> অ্যাডমিন প্যানেল</a>
    </div>
  </div>
</body>
</html>
